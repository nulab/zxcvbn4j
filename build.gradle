import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.kt3k.coveralls' version '2.12.2'
    id "me.champeau.jmh" version "0.7.1"
    id "com.github.spotbugs" version "6.4.6"
    id 'com.github.sherter.google-java-format' version '0.9'
}

group = 'com.nulab-inc'
version = '1.9.0'
ext.isReleaseVersion = !version.endsWith('SNAPSHOT')

base {
    archivesName = 'zxcvbn'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_7
    targetCompatibility = JavaVersion.VERSION_1_7
}

//suppress warnings about gradle not supporting java 7.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
}

wrapper {
    gradleVersion = '9.2.1'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.graalvm.js:js:22.0.0.2'
    testImplementation 'org.graalvm.js:js-scriptengine:22.0.0.2'
    jmh 'org.openjdk.jmh:jmh-core:1.34'
    jmh 'org.openjdk.jmh:jmh-generator-annprocess:1.34'
    jmh 'org.ow2.asm:asm:9.3'
}

spotbugs {
    ignoreFailures = false
    effort = Effort.MAX
    //spotBugs reportLevel enum inaccessible workaround
    //https://github.com/spotbugs/spotbugs-gradle-plugin/issues/972
    reportLevel = Confidence.valueOf("HIGH")
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    reports.create("html") {
        required = true
    }
}

//more recent versions don't support jdk7.
googleJavaFormat {
    toolVersion = '1.7'
}

checkstyle {
    toolVersion = '12.2.0'
    configProperties = [
            "org.checkstyle.google.suppressionxpathfilter.config":
                    "${projectDir}/config/checkstyle/suppressions-xpath.xml",
    ]
    ignoreFailures = false
    maxWarnings = 0
    checkstyleTest.enabled = false
}

tasks.register("compileModuleInfoJava", JavaCompile) {
    dependsOn compileJava
    classpath = files()
    source = 'src/main/java9/module-info.java'
    destinationDirectory  = compileJava.destinationDirectory
    doLast {
        def descriptor = new File(destinationDirectory.get().asFile, 'module-info.class')
        def dest = new File(destinationDirectory.get().asFile, 'META-INF/versions/9')
        ant.move file: descriptor, todir: dest
    }

    doFirst {
        options.compilerArgs = [
                '--release', '9',
                '--module-path', compileJava.classpath.asPath
        ]
    }
 }

classes.dependsOn compileModuleInfoJava

javadoc {
    options.locale = 'en_US'
    title = 'zxcvbn4j ' + version + ' API'
}

// Turning off doclint in JDK 8 Javadoc
// ref : http://blog.joda.org/2014/02/turning-off-doclint-in-jdk-8-javadoc.html
if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': base.archivesName, 'Implementation-Version': archiveVersion, 'Multi-Release': true
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

configurations {
    deployerJars
}

publishing {
    repositories {
        maven {
            // Skip uploading production archives when using github actions
            if (System.env.GITHUB_ACTIONS && isReleaseVersion) return

            def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
            url = isReleaseVersion ? releasesRepoUrl : snapshotsRepoUrl
            credentials {
                username = project.hasProperty('ossrhUsername') ? ossrhUsername : 'Unknown user'
                password = project.hasProperty('ossrhPassword') ? ossrhPassword : 'Unknown password'
            }
        }
    }

    publications {
        register("mavenJava", MavenPublication) {
            from components.java

            pom {
                name = 'zxcvbn4j'
                artifactId = base.archivesName
                packaging = 'jar'
                description = 'This is a java port of zxcvbn, which is a JavaScript password strength generator.'
                url = 'https://github.com/nulab/zxcvbn4j'

                scm {
                    connection = 'https://github.com/nulab/zxcvbn4j.git'
                    developerConnection = 'https://github.com/nulab/zxcvbn4j.git'
                    url = 'https://github.com/nulab/zxcvbn4j.git'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                    }
                }

                developers {
                    developer {
                        id = 'vvatanabe'
                        name = 'Yuichi Watanabe'
                        email = 'yuichi.watanabe@nulab-inc.com'
                    }
                }
            }
        }
    }
}

if (project.hasProperty("signing.keyId")) {
    signing {
        // Skip signing snapshot archives
        if (System.env.GITHUB_ACTIONS || !isReleaseVersion) return

        sign publishing.publications.mavenJava
    }
}

test {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    forkEvery = 4
    testLogging.showStandardStreams = true
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true // coveralls plugin depends on xml format report
        html.required = true
    }
}